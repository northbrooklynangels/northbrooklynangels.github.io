<!-- A band of big numbers. Two per row on phones, up to four per row on larger screens.
       - type: stats
         background: bright    # optional, defaults to bright
         items:
           - value: "1,000"
             label: "turkeys for families who cook at home"
-->
{{ $section := .section }}

<section{{ with $section.id }} id="{{ . }}"{{ end }} class="{{ partial "campaign/background.html" ($section.background | default "bright") }} py-10 md:py-12">
  <div class="campaign-container">
    <dl class="grid grid-cols-2 gap-x-6 gap-y-8 md:grid-cols-4">
      {{ range $section.items }}
        <!-- A <dl> needs the label (dt) before the value (dd), so flex-col-reverse puts the number on top visually -->
        <div class="flex flex-col-reverse justify-end">
          <dt class="text-sm leading-snug mt-1 max-w-[16rem]">{{ .label }}</dt>
          <dd class="font-display font-bold text-campaign-heading text-4xl md:text-5xl leading-none">{{ .value }}</dd>
        </div>
      {{ end }}
    </dl>
  </div>
</section>
