{{- /* Declares a marker for the map on this page. Renders an inert <template> that src/ts/map.ts reads once the map has loaded. */ -}}
{{- $lat := .Get "lat" | default "" -}}
{{- $long := .Get "long" | default "" -}}
{{- $address := .Get "address" | default "" -}}
{{- $title := .Get "title" | default "" -}}

{{- $coordRegex := `^-?\d+(\.\d+)?$` -}}
{{- if and $lat $long -}}
    {{- if not (and (findRE $coordRegex $lat) (findRE $coordRegex $long)) -}}
        {{- errorf "Invalid map marker %q: lat %q and long %q must be numbers" $title $lat $long -}}
    {{- end -}}
{{- else if $address -}}
    {{- warnf "Map marker %q uses an address, which is geocoded in the browser through Google Maps (and counts against usage quotas). Consider using lat/long instead." $title -}}
{{- else -}}
    {{- errorf "Map marker %q needs either lat and long, or an address" $title -}}
{{- end -}}

<template class="map-marker" data-title="{{ $title }}" data-lat="{{ $lat }}" data-long="{{ $long }}" data-address="{{ $address }}">
    {{- .Inner | markdownify -}}
</template>
